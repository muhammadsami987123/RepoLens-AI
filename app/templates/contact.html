<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — RepoLens AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #070711; }</style>
</head>
<body class="bg-[#070711] text-white min-h-screen">
<nav class="border-b border-gray-800 px-6 py-3 flex items-center justify-between">
  <a href="/" class="flex items-center gap-2 font-semibold text-sm">
    <div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-purple-600 rounded-md"></div>
    <span>RepoLens <span class="text-blue-400">AI</span></span>
  </a>
  <div class="flex items-center gap-4 text-sm">
    <a href="/about" class="text-gray-400 hover:text-white transition-colors">About</a>
    {% if user %}<a href="/dashboard" class="text-blue-400 hover:text-blue-300">Dashboard</a>{% else %}
    <a href="/signup" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg">Get Started</a>{% endif %}
  </div>
</nav>

<div class="max-w-lg mx-auto px-4 py-16">
  <div class="text-center mb-10">
    <h1 class="text-3xl font-bold mb-3">Contact Us</h1>
    <p class="text-gray-400 text-sm">Have a question or feedback? We'd love to hear from you.</p>
  </div>

  <div id="success" class="hidden mb-6 bg-green-500/10 border border-green-500/20 rounded-xl p-4 text-green-400 text-sm text-center">
    Message sent. Thank you for reaching out!
  </div>
  <div id="error" class="hidden mb-6 bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-red-400 text-sm"></div>

  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <form id="contact-form" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Name</label>
        <input type="text" id="c-name" required placeholder="Your name"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-blue-500/60 transition-colors" />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Email</label>
        <input type="email" id="c-email" required placeholder="you@example.com"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-blue-500/60 transition-colors" />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Subject</label>
        <input type="text" id="c-subject" required placeholder="What's this about?"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-blue-500/60 transition-colors" />
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Message</label>
        <textarea id="c-message" rows="4" required placeholder="Your message..."
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-blue-500/60 transition-colors resize-none"></textarea>
      </div>
      <button type="submit" id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-medium text-sm transition-all">
        Send Message
      </button>
    </form>
  </div>
</div>

<script>
  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Sending...';
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('c-name').value,
        email: document.getElementById('c-email').value,
        subject: document.getElementById('c-subject').value,
        message: document.getElementById('c-message').value,
      }),
    });
    if (res.ok) {
      document.getElementById('success').classList.remove('hidden');
      document.getElementById('contact-form').reset();
    } else {
      document.getElementById('error').textContent = 'Failed to send message. Please try again.';
      document.getElementById('error').classList.remove('hidden');
    }
    btn.disabled = false; btn.textContent = 'Send Message';
  });
</script>
</body>
</html>
