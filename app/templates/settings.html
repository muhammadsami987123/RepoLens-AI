<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — RepoLens AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #070711; }</style>
</head>
<body class="bg-[#070711] text-white min-h-screen">
<nav class="border-b border-gray-800 px-6 py-3 flex items-center justify-between">
  <a href="/" class="flex items-center gap-2 font-semibold text-sm">
    <div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-purple-600 rounded-md"></div>
    <span>RepoLens <span class="text-blue-400">AI</span></span>
  </a>
  <div class="flex items-center gap-4">
    <a href="/dashboard" class="text-sm text-gray-400 hover:text-white transition-colors">Dashboard</a>
    <button onclick="logout()" class="text-sm text-gray-600 hover:text-gray-400 transition-colors">Sign out</button>
  </div>
</nav>

<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-xl font-bold mb-6">Settings</h1>

  <!-- Profile -->
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-4">
    <h2 class="text-sm font-semibold mb-4 text-gray-300">Profile</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-500 mb-1.5">Full Name</label>
        <input id="pf-name" type="text" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-blue-500/50" />
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1.5">Email</label>
        <input id="pf-email" type="email" disabled class="w-full bg-gray-800/50 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-500 cursor-not-allowed" />
      </div>
      <button class="text-sm bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-colors">Save Changes</button>
    </div>
  </div>

  <!-- Analysis Preferences -->
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-4">
    <h2 class="text-sm font-semibold mb-4 text-gray-300">Analysis Preferences</h2>
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-gray-300">Default Analysis Depth</div>
          <div class="text-xs text-gray-600">Used when starting new analyses</div>
        </div>
        <select class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white outline-none">
          <option value="standard">Standard</option>
          <option value="deep" selected>Deep</option>
          <option value="architecture_only">Architecture Only</option>
          <option value="security_focus">Security Focus</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Account -->
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
    <h2 class="text-sm font-semibold mb-4 text-gray-300">Account</h2>
    <div class="space-y-3">
      <div class="flex items-center justify-between py-2 border-b border-gray-800">
        <span class="text-sm text-gray-400">Member since</span>
        <span class="text-sm text-gray-500" id="member-since">—</span>
      </div>
      <div class="flex items-center justify-between py-2 border-b border-gray-800">
        <span class="text-sm text-gray-400">Repositories analyzed</span>
        <span class="text-sm text-gray-300" id="analyses-count">—</span>
      </div>
      <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 border border-red-500/20 hover:border-red-500/40 px-4 py-2 rounded-lg transition-colors">Sign Out</button>
    </div>
  </div>
</div>

<script>
  function logout() { fetch('/api/auth/logout',{method:'POST'}).then(()=>{window.location.href='/'}); }
  fetch('/api/auth/me').then(r=>r.json()).then(user=>{
    document.getElementById('pf-name').value = user.name || '';
    document.getElementById('pf-email').value = user.email || '';
    document.getElementById('analyses-count').textContent = user.analyses_count || 0;
    document.getElementById('member-since').textContent = new Date(user.created_at).toLocaleDateString();
  });
</script>
</body>
</html>
