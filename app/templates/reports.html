<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — RepoLens AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; }
    .card:hover { border-color: #cbd5e1; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .btn-primary { background: #2563eb; color: white; border-radius: 9px; padding: 8px 18px; font-size: 0.8rem; font-weight: 600; transition: all 0.15s; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-primary:hover { background: #1d4ed8; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
    .btn-outline { border: 1.5px solid #e2e8f0; border-radius: 9px; padding: 7px 14px; font-size: 0.8rem; font-weight: 500; color: #475569; transition: all 0.15s; text-decoration: none; display: inline-flex; align-items: center; background: white; }
    .btn-outline:hover { border-color: #94a3b8; color: #1e293b; background: #f8fafc; }
    .health-bar { height: 4px; border-radius: 99px; background: #e2e8f0; overflow: hidden; }
    .health-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  </style>
</head>
<body class="min-h-screen">

<!-- Navbar -->
<nav class="sticky top-0 z-20 bg-white border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5 font-semibold text-gray-900">
      <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-violet-600 rounded-xl flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
      </div>
      <span>RepoLens <span class="text-blue-600">AI</span></span>
    </a>
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-500 hover:text-gray-900 transition-colors font-medium">Dashboard</a>
      <a href="/analysis" class="text-sm text-gray-500 hover:text-gray-900 transition-colors font-medium">New Analysis</a>
      <button onclick="logout()" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">Sign out</button>
    </div>
  </div>
</nav>

<div class="max-w-5xl mx-auto px-4 py-8">
  <!-- Header -->
  <div class="flex items-center justify-between mb-7">
    <div>
      <h1 class="text-xl font-bold text-gray-900">Report History</h1>
      <p class="text-sm text-gray-500 mt-0.5">All generated analysis reports</p>
    </div>
    <a href="/analysis" class="btn-primary">
      <svg class="w-3.5 h-3.5 inline mr-1.5 -mt-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      New Analysis
    </a>
  </div>

  <!-- Loading -->
  <div id="loading" class="py-14 text-center">
    <div class="inline-flex items-center gap-2 text-sm text-gray-400">
      <svg class="animate-spin w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
      Loading reports...
    </div>
  </div>

  <!-- Empty -->
  <div id="empty" class="hidden py-20 text-center">
    <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    </div>
    <h3 class="text-gray-800 font-semibold mb-1">No reports yet</h3>
    <p class="text-gray-400 text-sm mb-6">Analyze a repository to generate your first report.</p>
    <a href="/analysis" class="btn-primary">Analyze Repository</a>
  </div>

  <!-- Reports Grid -->
  <div id="reports-list" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>
</div>

<script>
  function logout() { fetch('/api/auth/logout', {method:'POST'}).then(()=>{window.location.href='/'}); }
  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff/60000);
    if (mins<1) return 'just now'; if (mins<60) return `${mins}m ago`;
    const hrs = Math.floor(mins/60); if (hrs<24) return `${hrs}h ago`;
    return new Date(iso).toLocaleDateString();
  }
  function healthColor(score) {
    if (score >= 80) return '#16a34a';
    if (score >= 60) return '#d97706';
    return '#dc2626';
  }
  function healthLabel(score) {
    if (score >= 80) return 'Excellent';
    if (score >= 60) return 'Good';
    if (score >= 40) return 'Fair';
    return 'Needs Work';
  }

  async function loadReports() {
    const res = await fetch('/api/reports');
    document.getElementById('loading').classList.add('hidden');
    if (!res.ok) return;
    const data = await res.json();
    const reports = data.reports || [];
    if (reports.length === 0) { document.getElementById('empty').classList.remove('hidden'); return; }
    const grid = document.getElementById('reports-list');
    grid.classList.remove('hidden');
    grid.innerHTML = reports.map(r => {
      const score = r.health_score?.overall || 0;
      const color = healthColor(score);
      const pct = Math.min(100, score);
      return `
        <div class="card p-5 transition-all">
          <div class="flex items-start justify-between mb-4">
            <div class="min-w-0 flex-1 pr-3">
              <div class="font-mono text-sm font-semibold text-blue-600 truncate">${r.owner}/${r.repository}</div>
              <div class="text-xs text-gray-400 mt-0.5">${timeAgo(r.created_at)}</div>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-lg font-bold" style="color:${color}">${score}</div>
              <div class="text-xs text-gray-400">/ 100</div>
            </div>
          </div>
          <div class="mb-4">
            <div class="health-bar">
              <div class="health-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <div class="text-xs mt-1" style="color:${color}">${healthLabel(score)}</div>
          </div>
          <div class="flex items-center gap-2 pt-3 border-t border-gray-100">
            <a href="/analysis/${r.analysis_id}" class="flex-1 text-center text-sm btn-outline">View Report</a>
            <a href="/api/reports/${r.id}/markdown" class="btn-outline gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              .md
            </a>
          </div>
        </div>`;
    }).join('');
  }
  loadReports();
</script>
</body>
</html>
