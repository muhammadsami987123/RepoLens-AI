<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — RepoLens AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #070711; }</style>
</head>
<body class="bg-[#070711] text-white min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-md">
  <!-- Logo -->
  <div class="text-center mb-8">
    <a href="/" class="inline-flex items-center gap-2 font-semibold text-white mb-6">
      <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
      </div>
      <span>RepoLens <span class="text-blue-400">AI</span></span>
    </a>
    <h1 class="text-2xl font-bold">Welcome back</h1>
    <p class="text-gray-400 text-sm mt-1">Sign in to your account</p>
  </div>

  <!-- Card -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-8">
    <!-- Error alert -->
    <div id="error-alert" class="hidden mb-5 bg-red-500/10 border border-red-500/20 rounded-lg p-3 text-red-400 text-sm"></div>

    <!-- OAuth buttons -->
    <div class="space-y-2.5 mb-6">
      <button class="w-full flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-300 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="w-full flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-300 transition-colors">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
      </button>
    </div>

    <div class="relative mb-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
      <div class="relative flex justify-center"><span class="bg-gray-900 px-3 text-xs text-gray-600">or continue with email</span></div>
    </div>

    <!-- Login form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Email</label>
        <input type="email" id="email" required placeholder="you@example.com"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-blue-500/60 focus:bg-gray-800 transition-colors" />
      </div>
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-sm text-gray-400">Password</label>
          <span class="text-xs text-gray-600 hover:text-gray-400 cursor-pointer transition-colors">Forgot password</span>
        </div>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 outline-none focus:border-blue-500/60 transition-colors" />
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="remember" class="rounded border-gray-700 bg-gray-800">
        <label for="remember" class="text-sm text-gray-400">Remember me</label>
      </div>
      <button type="submit" id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-lg py-2.5 text-sm font-medium transition-all mt-1">
        Sign In
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-5">
      Don't have an account?
      <a href="/signup" class="text-blue-400 hover:text-blue-300 transition-colors">Create one</a>
    </p>
  </div>

  <p class="text-center text-xs text-gray-700 mt-6">
    <a href="/" class="hover:text-gray-500 transition-colors">← Back to home</a>
  </p>
</div>

<script>
  const nextUrl = new URLSearchParams(window.location.search).get('next') || '/dashboard';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errDiv = document.getElementById('error-alert');
    errDiv.classList.add('hidden');
    btn.textContent = 'Signing in...';
    btn.disabled = true;

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });

    if (res.ok) {
      window.location.href = nextUrl;
    } else {
      const data = await res.json();
      errDiv.textContent = data.detail || 'Login failed. Please check your credentials.';
      errDiv.classList.remove('hidden');
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
